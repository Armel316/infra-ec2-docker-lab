name: Deploy Infrastructure

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      # =====================================
      # 1️⃣ Checkout
      # =====================================
      - name: Checkout repository
        uses: actions/checkout@v3

      # =====================================
      # 2️⃣ Setup Terraform
      # =====================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init -reconfigure

      # =====================================
      # 🔥 3️⃣ Destroy (important pour SSH key)
      # =====================================
      - name: Terraform Destroy (clean previous infra)
        working-directory: ./terraform
        run: terraform destroy -auto-approve || true

      # =====================================
      # 4️⃣ Apply
      # =====================================
      - name: Terraform Apply
        working-directory: ./terraform
        run: terraform apply -auto-approve

      # =====================================
      # 5️⃣ Outputs
      # =====================================
      - name: Get Public IP
        working-directory: ./terraform
        run: |
          PUBLIC_IP=$(terraform output -raw public_ip | tr -d '\n')
          echo "PUBLIC_IP=$PUBLIC_IP" >> $GITHUB_ENV

      - name: Get Private Key
        working-directory: ./terraform
        run: |
          terraform output -raw private_key_pem > ../private_key.pem
          chmod 600 ../private_key.pem

      # =====================================
      # 6️⃣ Wait for SSH
      # =====================================
      - name: Wait for SSH
        run: |
          echo "Waiting for SSH..."
          for i in {1..30}; do
            if ssh -i private_key.pem \
               -o StrictHostKeyChecking=no \
               -o ConnectTimeout=5 \
               ubuntu@$PUBLIC_IP "echo ok" 2>/dev/null; then
              echo "SSH is ready!"
              exit 0
            fi
            sleep 5
          done
          echo "SSH connection failed."
          exit 1

      # =====================================
      # 7️⃣ Install Ansible
      # =====================================
      - name: Install Ansible
        run: sudo apt update && sudo apt install ansible -y

      # =====================================
      # 8️⃣ Inventory
      # =====================================
      - name: Create Ansible inventory
        run: |
          cat <<EOF > inventory.yml
          all:
            children:
              web:
                hosts:
                  react_server:
                    ansible_host: ${PUBLIC_IP}
                    ansible_user: ubuntu
                    ansible_ssh_private_key_file: private_key.pem
          EOF

      # =====================================
      # 9️⃣ Run Playbook
      # =====================================
      - name: Run Ansible Playbook
        run: ansible-playbook -i inventory.yml ansible/playbook.yml